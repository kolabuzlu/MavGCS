name: tests

# Every push and every pull request. The suites take seconds; the install
# is the slow part, and it is cached.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    strategy:
      # Windows must report even when macOS is broken, and the other way
      # round. Cancelling the pair on the first failure would hide which
      # of the two platforms actually regressed.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    # The two jobs are here for different reasons, and neither replaces
    # the other.
    #
    # Windows is where MavGCS runs, and where the things worth testing are
    # real: the graphics-card preference is in the registry, the adapter
    # check is DXGI, the camera list is DirectShow. This job is the one
    # that says the program works.
    #
    # macOS runs the same suites to say something narrower but just as
    # useful: that nothing Windows-only has leaked into module scope, and
    # that every platform-guarded path still returns sensibly when the
    # platform is not Windows. Those paths return early here and prove
    # nothing about the registry or DXGI - they are not meant to. What a
    # red macOS job means is that the program has stopped being portable,
    # which is a thing we would otherwise only discover on a Mac.
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the suites
        env:
          # No display on a runner. Nothing here opens a window, but Qt
          # has to be told or importing it fails outright.
          QT_QPA_PLATFORM: offscreen
          MAVLINK20: "1"
        run: python tests/run_all.py
