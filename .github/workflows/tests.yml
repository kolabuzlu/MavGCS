name: tests

# Every push and every pull request. The suites take seconds; the install
# is the slow part, and it is cached.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    # Windows, because MavGCS is a Windows program and the things worth
    # testing are Windows things: the graphics-card preference is in the
    # registry, the adapter check is DXGI, the camera list is DirectShow.
    # On Linux those paths return early and the suites would pass without
    # having tested anything, which is worse than not running them.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the suites
        env:
          # No display on a runner. Nothing here opens a window, but Qt
          # has to be told or importing it fails outright.
          QT_QPA_PLATFORM: offscreen
          MAVLINK20: "1"
        run: python tests/run_all.py
